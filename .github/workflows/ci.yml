name: Проверка

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Сборка и тесты (TypeScript, сверка с Python, Python)
        run: npm test
      - name: Собранный docs/*.js совпадает с src/*.ts
        run: |
          git diff --exit-code -- docs || { echo "::error::docs/*.js устарели: выполните npm run build и закоммитьте результат"; exit 1; }
